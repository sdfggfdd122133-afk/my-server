<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDEA | Dream • Build • Grow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/index.css">

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", sans-serif;
      background:
        linear-gradient(rgba(2, 12, 25, 0.30), rgba(2, 12, 25, 0.38)),
        url("/images/idba-hero.jpg") center center / cover fixed no-repeat;
      color: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0.18),
        rgba(0, 40, 80, 0.12)
      );
      pointer-events: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .page {
      width: min(1180px, 94%);
      margin: auto;
      padding: 22px 0 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 14px 20px;
      margin-bottom: 35px;

      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 22px;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.15);
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .brand small {
      display: block;
      font-size: 10px;
      letter-spacing: 4px;
      opacity: 0.75;
    }

    .language-btn {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      color: #fff;
      padding: 9px 17px;
      border-radius: 14px;
      cursor: pointer;
      transition: .25s ease;
    }

    .language-btn:hover {
      background: rgba(255,255,255,.14);
      transform: translateY(-1px);
    }

    .hero {
      text-align: center;
      padding: 45px 15px 30px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 78px);
      font-weight: 900;
      line-height: 1.1;
      text-shadow: 0 5px 30px rgba(0,0,0,.4);
    }

    .hero p {
      max-width: 800px;
      margin: 22px auto 0;
      font-size: clamp(16px, 2vw, 21px);
      line-height: 2;
      opacity: .94;
    }

    .quote {
      text-align: center;
      margin: 20px auto 45px;
      padding: 12px 20px;
      width: fit-content;
      max-width: 90%;

      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 30px;

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .contact-section {
      display: flex;
      justify-content: center;
      padding: 15px 0 60px;
    }

    .contact-card {
      width: min(760px, 100%);
      padding: 35px;

      background: rgba(4, 20, 38, 0.18);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 30px;

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      box-shadow:
        0 25px 80px rgba(0,0,0,.20);
    }

    .contact-card h2 {
      text-align: center;
      margin: 0 0 28px;
      font-size: 28px;
      font-weight: 800;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
      opacity: .9;
    }

    .form-control {
      width: 100%;
      border: 1px solid rgba(255,255,255,.12);
      outline: none;

      color: #fff;
      background: rgba(255,255,255,.045);

      padding: 13px 15px;
      border-radius: 15px;

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      transition: .25s ease;
    }

    .form-control::placeholder {
      color: rgba(255,255,255,.60);
    }

    .form-control:focus {
      border-color: rgba(100,190,255,.55);
      background: rgba(255,255,255,.075);
      box-shadow: 0 0 0 3px rgba(70,170,255,.08);
    }

    textarea.form-control {
      min-height: 150px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      padding: 14px;
      margin-top: 5px;

      color: #fff;
      font-weight: 800;
      cursor: pointer;

      border-radius: 16px;
      background: linear-gradient(
        135deg,
        rgba(30,140,220,.85),
        rgba(40,90,190,.85)
      );

      box-shadow: 0 10px 30px rgba(0,100,220,.18);
      transition: .25s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .submit-btn:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    #messageStatus {
      min-height: 25px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    #mainWebsiteGallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 22px;

      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.10);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      box-shadow: 0 15px 45px rgba(0,0,0,.16);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
      transition: transform .45s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.045);
    }

    .gallery-description {
      padding: 13px 15px;
      line-height: 1.8;
      font-size: 14px;
      background: rgba(0,0,0,.08);
    }

    footer {
      text-align: center;
      padding: 35px 15px 15px;
      opacity: .85;
    }

    footer .dream {
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 800;
    }

    footer p {
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      .page {
        width: 92%;
      }

      .topbar {
        padding: 12px 14px;
      }

      .brand {
        font-size: 22px;
      }

      .hero {
        padding-top: 25px;
      }

      .contact-card {
        padding: 23px 17px;
        border-radius: 24px;
      }

      .gallery-item img {
        height: 210px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">
      <div class="brand">
        IDBA
        <small>DREAM • BUILD • GROW</small>
      </div>

      <button
        id="languageToggle"
        class="language-btn"
        type="button"
        aria-label="Change language">
        🌐 English
      </button>
    </header>

    <main>

      <section class="hero">
        <h1
          data-ar="فكرتك تبدأ هنا"
          data-en="Your Idea Starts Here">
          فكرتك تبدأ هنا
        </h1>

        <p
          data-ar="نحوّل الأفكار إلى واقع، ونبني حلولًا رقمية تنمو معك."
          data-en="We turn ideas into reality and build digital solutions that grow with you.">
          نحوّل الأفكار إلى واقع، ونبني حلولًا رقمية تنمو معك.
        </p>
      </section>

      <div class="quote">
        <span
          data-ar="احلم • ابنِ • انمُ"
          data-en="DREAM • BUILD • GROW">
          احلم • ابنِ • انمُ
        </span>
      </div>

      <section class="contact-section">

        <div class="contact-card">

          <h2>
            <span
              data-ar="تواصل معنا"
              data-en="Contact us">
              تواصل معنا
            </span>
          </h2>

          <form id="messageForm">

            <div class="form-group">
              <label
                for="phoneInput"
                data-ar="رقم الهاتف"
                data-en="Phone number">
                رقم الهاتف
              </label>

              <input
                id="phoneInput"
                class="form-control"
                type="tel"
                autocomplete="tel"
                data-placeholder-ar="أدخل رقم الهاتف"
                data-placeholder-en="Enter phone number"
                placeholder="أدخل رقم الهاتف">
            </div>

            <div class="form-group">
              <label
                for="countryInput"
                data-ar="الدولة"
                data-en="Country">
                الدولة
              </label>

              <input
                id="countryInput"
                class="form-control"
                type="text"
                autocomplete="country-name"
                data-placeholder-ar="الدولة"
                data-placeholder-en="Country"
                placeholder="الدولة">
            </div>

            <div class="form-group">
              <label
                for="cityInput"
                data-ar="المدينة"
                data-en="City">
                المدينة
              </label>

              <input
                id="cityInput"
                class="form-control"
                type="text"
                autocomplete="address-level2"
                data-placeholder-ar="المدينة"
                data-placeholder-en="City"
                placeholder="المدينة">
            </div>

            <div class="form-group">
              <label
                for="messageInput"
                data-ar="رسالتك"
                data-en="Your message">
                رسالتك
              </label>

              <textarea
                id="messageInput"
                class="form-control"
                data-placeholder-ar="اكتب رسالتك هنا..."
                data-placeholder-en="Write your message here..."
                placeholder="اكتب رسالتك هنا..."></textarea>
            </div>

            <button
              id="submitMessage"
              class="submit-btn"
              type="submit"
              data-ar="إرسال"
              data-en="Send">
              إرسال
            </button>

            <div id="messageStatus"></div>

          </form>
        </div>

      </section>

      <!--
        الصور التي تتم إضافتها لاحقًا من لوحة التحكم
        ستظهر هنا تلقائيًا.
      -->
      <section id="gallerySection">
        <div id="mainWebsiteGallery"></div>
      </section>

    </main>

    <footer>
      <div class="dream">
        DREAM • BUILD • GROW
      </div>

      <p
        data-ar="جميع الحقوق محفوظة © IDEA"
        data-en="All rights reserved © IDEA">
        جميع الحقوق محفوظة © IDEA
      </p>
    </footer>

  </div>

<script>
(() => {

  "use strict";

  const STORAGE_KEY = "idea-language";

  const languageToggle = document.getElementById("languageToggle");
  const messageForm = document.getElementById("messageForm");
  const submitMessage = document.getElementById("submitMessage");
  const messageStatus = document.getElementById("messageStatus");

  let currentLanguage = "ar";

  function detectLanguage() {

    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved === "ar" || saved === "en") {
      return saved;
    }

    const browserLanguage =
      navigator.language ||
      navigator.userLanguage ||
      "ar";

    return browserLanguage.toLowerCase().startsWith("ar")
      ? "ar"
      : "en";
  }

  function translatePage(language) {

    currentLanguage = language;

    document.documentElement.lang = language;
    document.documentElement.dir =
      language === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-ar][data-en]")
      .forEach(element => {

        element.textContent =
          element.dataset[language];

      });

    document.querySelectorAll("[data-placeholder-ar][data-placeholder-en]")
      .forEach(element => {

        element.placeholder =
          language === "ar"
            ? element.dataset.placeholderAr
            : element.dataset.placeholderEn;

      });

    languageToggle.textContent =
      language === "ar"
        ? "🌐 English"
        : "🌐 العربية";

    localStorage.setItem(STORAGE_KEY, language);

    document.title =
      language === "ar"
        ? "IDEA | Dream • Build • Grow"
        : "IDEA | Dream • Build • Grow";
  }

  languageToggle.addEventListener("click", () => {

    translatePage(
      currentLanguage === "ar"
        ? "en"
        : "ar"
    );

  });

  function escapeText(value) {
    return String(value ?? "");
  }

  function renderGallery(images) {

    const gallery =
      document.getElementById("mainWebsiteGallery");

    if (!gallery) return;

    gallery.innerHTML = "";

    if (!Array.isArray(images)) {
      return;
    }

    const bottomImages =
      images.filter(
        image =>
          image &&
          image.path &&
          image.position === "bottom"
      );

    bottomImages.forEach(image => {

      const item =
        document.createElement("article");

      item.className = "gallery-item";

      const img =
        document.createElement("img");

      img.src = escapeText(image.path);
      img.alt =
        currentLanguage === "ar"
          ? "صورة"
          : "Image";

      img.loading = "lazy";

      const description =
        document.createElement("div");

      description.className =
        "gallery-description";

      description.textContent =
        escapeText(image.desc || "");

      item.appendChild(img);

      if (image.desc) {
        item.appendChild(description);
      }

      gallery.appendChild(item);

    });
  }

  async function loadGallery() {

    try {

      const response =
        await fetch("/api/images", {
          cache: "no-store"
        });

      if (!response.ok) {
        throw new Error("Gallery request failed");
      }

      const images =
        await response.json();

      renderGallery(images);

    } catch (error) {

      console.error(
        "Gallery loading error:",
        error
      );

    }
  }

  async function trackPage() {

    try {

      await fetch(
        "/track?page=" +
        encodeURIComponent(
          window.location.pathname
        ),
        {
          method: "GET",
          cache: "no-store"
        }
      );

    } catch (error) {

      console.warn(
        "Tracking unavailable:",
        error
      );

    }
  }

  messageForm.addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const message =
        document.getElementById(
          "messageInput"
        ).value.trim();

      const phone =
        document.getElementById(
          "phoneInput"
        ).value.trim();

      const country =
        document.getElementById(
          "countryInput"
        ).value.trim();

      const city =
        document.getElementById(
          "cityInput"
        ).value.trim();

      if (!message) {

        messageStatus.textContent =
          currentLanguage === "ar"
            ? "من فضلك اكتب رسالتك."
            : "Please write your message.";

        return;
      }

      submitMessage.disabled = true;

      messageStatus.textContent =
        currentLanguage === "ar"
          ? "جاري الإرسال..."
          : "Sending...";

      try {

        const response =
          await fetch("/message", {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message,
              phone,
              country,
              city
            })
          });

        let result = {};

        try {
          result = await response.json();
        } catch (_) {
          result = {};
        }

        if (!response.ok) {
          throw new Error(
            result.message ||
            "Message request failed"
          );
        }

        messageStatus.textContent =
          currentLanguage === "ar"
            ? "تم إرسال رسالتك بنجاح."
            : "Your message was sent successfully.";

        messageForm.reset();

        translatePage(currentLanguage);

      } catch (error) {

        console.error(
          "Message error:",
          error
        );

        messageStatus.textContent =
          currentLanguage === "ar"
            ? "تعذر إرسال الرسالة، حاول مرة أخرى."
            : "Unable to send the message. Please try again.";

      } finally {

        submitMessage.disabled = false;

      }

    }
  );

  const socket =
    typeof io === "function"
      ? io()
      : null;

  if (socket) {

    socket.on(
      "refresh-gallery",
      images => {
        renderGallery(images);
      }
    );

  }

  translatePage(detectLanguage());

  loadGallery();
  trackPage();

})();
</script>

</body>
</html>
